async function initFirebase() {

// ─── Utilidades ─────────────────────────────────────────────
function generateCard() {
  // Cartón estándar 5x5 (BINGO): B1-15, I16-30, N31-45, G46-60, O61-75
  const cols = [
    { label: 'B', min: 1,  max: 15 },
    { label: 'I', min: 16, max: 30 },
    { label: 'N', min: 31, max: 45 },
    { label: 'G', min: 46, max: 60 },
    { label: 'O', min: 61, max: 75 },
  ];
  return cols.map(({ label, min, max }) => {
    const pool = [];
    for (let n = min; n <= max; n++) pool.push(n);
    const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 5);
    return shuffled.map(n => ({ col: label, num: n }));
  });
}

function seudoCardFromId(userId) {
  // Genera cartón determinístico por userId usando seed
  let seed = 0;
  for (let i = 0; i < userId.length; i++) seed = (seed * 31 + userId.charCodeAt(i)) % 100000;
  const rand = (max) => { seed = (seed * 9301 + 49297) % 233280; return Math.floor((seed / 233280) * max); };
  const cols = [
    { label: 'B', min: 1,  max: 15 },
    { label: 'I', min: 16, max: 30 },
    { label: 'N', min: 31, max: 45 },
    { label: 'G', min: 46, max: 60 },
    { label: 'O', min: 61, max: 75 },
  ];
  return cols.map(({ label, min, max }) => {
    const pool = [];
    for (let n = min; n <= max; n++) pool.push(n);
    // Fisher-Yates con seed
    for (let i = pool.length - 1; i > 0; i--) {
      const j = rand(i + 1);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 5).map(n => ({ col: label, num: n }));
  });
}

function checkBingo(card, calledSet) {
  // Construir matriz 5x5 (filas: índice en columna, cols: B,I,N,G,O)
  // card[colIdx][rowIdx]
  const SIZE = 5;
  const isMarked = (col, row) => {
    if (col === 2 && row === 2) return true; // FREE
    return calledSet.has(card[col][row].num);
  };

  // Filas
  for (let r = 0; r < SIZE; r++) {
    if ([0,1,2,3,4].every(c => isMarked(c, r))) return true;
  }
  // Columnas
  for (let c = 0; c < SIZE; c++) {
    if ([0,1,2,3,4].every(r => isMarked(c, r))) return true;
  }
  // Diagonal principal
  if ([0,1,2,3,4].every(i => isMarked(i, i))) return true;
  // Diagonal inversa
  if ([0,1,2,3,4].every(i => isMarked(i, 4 - i))) return true;

  return false;
}

function BingoCard({ card, calledNumbers, userId, cardInfo }) {
  const calledSet = new Set(calledNumbers);

  return (
    <div className="w-full max-w-sm mx-auto">

        <span className="text-xs text-white/50 font-medium">{cardInfo}</span>
        <span className="text-xs text-gold font-bold">{calledNumbers.length} números cantados</span>
      </div>

      {/* Column headers */}
      <div className="grid grid-cols-5 gap-1.5 mb-1.5">
        {cols.map((c, i) => (
          <div key={i} className="text-center font-display font-black text-lg" style={{ color: ['#F5C518','#22A870','#FFE57A','#F5C518','#22A870'][i] }}>
            {c}
          </div>
        ))}
      </div>

      {/* Grid */}
      <div className="grid grid-cols-5 gap-1.5">
        {[0,1,2,3,4].map(row =>
          [0,1,2,3,4].map(col => {
            const isCenter = col === 2 && row === 2;
            const cell = card[col][row];
            const isCalled = !isCenter && calledSet.has(cell.num);
            return (
              <div
                key={`${row}-${col}`}
                className={`bingo-cell font-display ${isCalled ? 'called' : ''} ${isCenter ? 'free-space' : ''}`}

                  <span className="text-lg">⭐</span>
                ) : (
                  <>
                    {cell.num}
                    {isCalled && <span className="stamp">🔵</span>}
                  </>
                )}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

        {/* Último número cantado */}
        {gameState === 'running' || calledNumbers.length > 0 ? (
          <div className="glass-card p-5 mb-4 text-center">
            <p className="text-xs text-white/50 uppercase tracking-wider mb-3 font-semibold">Último número</p>
            {lastNum ? (
              <div className="flex items-center justify-center gap-3">
                <div className="number-ball">{lastNum}</div>
                <div className="text-left">
                  <p className="font-display text-3xl font-black text-gold">{lastCol}-{lastNum}</p>
                  <p className="text-xs text-white/50">
                    {calledSet.has(lastNum) && card.flat().some(c => c.num === lastNum) ? (
                      <span className="text-emerald-light font-bold">✅ ¡Está en tu cartón!</span>
                    ) : (
                      <span className="text-white/40">No está en tu cartón</span>
                    )}
                  </p>
                </div>
              </div>
            ) : (
              <p className="text-white/40 text-sm">Esperando primer número...</p>
            )}
          </div>
        ) : (
          <div className="glass-card p-5 mb-4 text-center">
            <p className="text-3xl mb-2">⏳</p>
            <p className="font-bold text-white/70">Partida no iniciada</p>
            <p className="text-xs text-white/40 mt-1">El administrador iniciará pronto</p>
          </div>
        )}

        {/* Cartón */}
        <div className="glass-card p-5 mb-4">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-display font-bold text-gold">Tu Cartón</h3>
            <span className="text-xs text-white/40">ID: {userId.slice(-4)}</span>
          </div>
          <BingoCard
            card={card}
            calledNumbers={calledNumbers}
            userId={userId}
            cardInfo={`Hoja 1, Cartón #${userId.charCodeAt(0) % 99 + 1}`}
          />
        </div>

        {/* Progreso */}
        <div className="glass-card p-4 mb-4">
          <div className="flex justify-between items-center mb-2">
            <span className="text-xs text-white/50 font-semibold uppercase tracking-wider">Tu progreso</span>
            <span className="text-xs text-gold font-bold">
              {card.flat().filter(c => calledSet.has(c.num)).length + 1}/25
            </span>
          </div>
          <div className="h-2 bg-white/5 rounded-full overflow-hidden">
            <div
              className="h-full bg-gradient-to-r from-emerald-light to-gold rounded-full transition-all duration-700"
              style={{ width: `${((card.flat().filter(c => calledSet.has(c.num)).length + 1) / 25) * 100}%` }}
            ></div>
          </div>
        </div>

        {/* Motivational */}
        <div className="text-center py-4">
          <p className="text-xs text-white/30 italic">
            "La familia Bol$illo Lleno camina junta hacia la abundancia 💚"
          </p>
        </div>
      </div>
    </div>
  );
}

// ADMIN VIEW
function AdminView({ onLogout }) {
  const [gameState, setGameState] = useState('idle'); // idle | running | paused | ended
  const [calledNumbers, setCalledNumbers] = useState([]);
  const [interval, setIntervalVal] = useState(5);
  const [loading, setLoading] = useState(false);
  const [winnerId, setWinnerId] = useState(null);
  const [dbReady, setDbReady] = useState(false);
  const [error, setError] = useState('');
  const timerRef = useRef(null);

  // Estado en tiempo real desde Firestore
  useEffect(() => {
    let unsubscribe;
    const setupListener = async () => {
      try {
        if (!db) await initFirebase();
        setDbReady(true);
        const { onSnapshot, doc } = fsLib;
        unsubscribe = onSnapshot(doc(db, 'juego_actual', 'estado'), (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            setGameState(data.estado || 'idle');
            setCalledNumbers(data.numeros || []);
            setWinnerId(data.ganador || null);
          }
        }, (err) => {
          console.error('Firestore error:', err);
          setError('⚠️ Error de conexión con Firebase. Revisa tu configuración.');
        });
      } catch (e) {
        console.error(e);
        setError('⚠️ Firebase no configurado. Ingresa tus credenciales en el bloque firebaseConfig.');
      }
    };
    setupListener();
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  // Motor de números automático (solo en admin)
  useEffect(() => {
    if (gameState === 'running') {
      timerRef.current = setInterval(async () => {
        await drawNumber();
      }, interval * 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [gameState, interval, calledNumbers]);

  const drawNumber = async () => {
    if (!db || !fsLib) return;
    const { doc, updateDoc, arrayUnion } = fsLib;

    // Elegir número no repetido
    const all = Array.from({ length: 75 }, (_, i) => i + 1);
    const remaining = all.filter(n => !calledNumbers.includes(n));
    if (remaining.length === 0) {
      await endGame();
      return;
    }
    const picked = remaining[Math.floor(Math.random() * remaining.length)];
    await updateDoc(doc(db, 'juego_actual', 'estado'), {
      numeros: arrayUnion(picked)
    });
  };

  const startGame = async () => {
    if (!db || !fsLib) { setError('Firebase no inicializado'); return; }
    setLoading(true);
    const { doc, setDoc } = fsLib;
    await setDoc(doc(db, 'juego_actual', 'estado'), {
      estado: 'running',
      numeros: [],
      ganador: null,
      iniciadoEn: new Date().toISOString(),
      intervalo: interval,
    });
    setCalledNumbers([]);
    setWinnerId(null);
    setLoading(false);
  };

  const pauseGame = async () => {
    if (!db || !fsLib) return;
    const { doc, updateDoc } = fsLib;
    await updateDoc(doc(db, 'juego_actual', 'estado'), { estado: gameState === 'running' ? 'paused' : 'running' });
  };

  const endGame = async () => {
    if (!db || !fsLib) return;
    const { doc, updateDoc } = fsLib;
    clearInterval(timerRef.current);
    await updateDoc(doc(db, 'juego_actual', 'estado'), { estado: 'ended' });
  };

  const declareWinner = async (userId) => {
    if (!db || !fsLib || !userId) return;
    const { doc, updateDoc } = fsLib;
    await updateDoc(doc(db, 'juego_actual', 'estado'), { ganador: userId, estado: 'ended' });
  };

  const [manualWinnerId, setManualWinnerId] = useState('');
  const cols = ['B','I','N','G','O'];

  return (
    <div className="min-h-screen bg-animated pb-20">
      <Header />
      <div className="relative z-10 px-4 pt-2">

        {/* Admin badge */}
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2 bg-gold/10 border border-gold/20 rounded-full px-4 py-1.5">
            <span className="text-gold text-sm">⚙️</span>
            <span className="text-xs font-bold text-gold uppercase tracking-wider">Panel Administrador</span>
          </div>
          <button className="text-xs text-white/40 hover:text-white/70 transition-colors" onClick={onLogout}>
            Salir →
          </button>
        </div>

        {error && (
          <div className="bg-red-500/10 border border-red-500/30 rounded-xl p-4 mb-4 text-xs text-red-300">
            {error}
          </div>
        )}

        {/* Game status card */}
        <div className="glass-card p-5 mb-4">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-display font-bold text-lg text-gold">Estado del Juego</h3>
            <span className={`text-xs font-bold px-3 py-1 rounded-full ${
              gameState === 'running' ? 'bg-emerald-light/20 text-emerald-light' :
              gameState === 'paused' ? 'bg-yellow-400/20 text-yellow-400' :
              gameState === 'ended' ? 'bg-red-400/20 text-red-400' :
              'bg-white/10 text-white/50'
            }`}>
              {gameState === 'running' ? '🟢 EN VIVO' :
               gameState === 'paused' ? '🟡 PAUSADO' :
               gameState === 'ended' ? '🔴 TERMINADO' : '⚪ INACTIVO'}
            </span>
          </div>

          {/* Interval control */}
          <div className="mb-5">
            <div className="flex justify-between items-center mb-2">
              <label className="text-xs font-semibold text-white/60 uppercase tracking-wider">Intervalo entre números</label>
              <span className="text-gold font-bold text-sm">{interval}s</span>
            </div>
            <input
              type="range" min="3" max="30" value={interval}
              onChange={e => setIntervalVal(Number(e.target.value))}
              disabled={gameState === 'running'}
              className="w-full"
            />
            <div className="flex justify-between text-xs text-white/30 mt-1">
              <span>3s (rápido)</span><span>30s (lento)</span>
            </div>
          </div>

          {/* Control buttons */}
          <div className="grid grid-cols-2 gap-3">
            {gameState === 'idle' || gameState === 'ended' ? (
              <button className="btn-gold col-span-2" onClick={startGame} disabled={loading || !dbReady}>
                {loading ? '⏳ Iniciando...' : '🎮 Iniciar Partida'}
              </button>
            ) : (
              <>
                <button className="btn-emerald" onClick={pauseGame}>
                  {gameState === 'running' ? '⏸ Pausar' : '▶️ Reanudar'}
                </button>
                <button className="btn-red" onClick={endGame}>🛑 Terminar</button>
              </>
            )}
          </div>
        </div>

        {/* Last number */}
        {calledNumbers.length > 0 && (
          <div className="glass-card p-5 mb-4 text-center">
            <p className="text-xs text-white/50 uppercase tracking-wider mb-3">Último número cantado</p>
            <div className="flex items-center justify-center gap-3">
              <div className="number-ball">
                {calledNumbers[calledNumbers.length - 1]}
              </div>
              <div>
                <p className="font-display text-3xl font-black text-gold">
                  {cols[Math.floor((calledNumbers[calledNumbers.length - 1] - 1) / 15)]}-{calledNumbers[calledNumbers.length - 1]}
                </p>
                <p className="text-xs text-white/40">{calledNumbers.length} de 75 números</p>
              </div>
            </div>
          </div>
        )}

        {/* History */}
        {calledNumbers.length > 0 && (
          <div className="glass-card p-5 mb-4">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold text-sm text-gold">Historial de Números</h3>
              <span className="text-xs text-white/40">{calledNumbers.length} cantados</span>
            </div>
            <div className="flex flex-wrap gap-2 max-h-36 overflow-y-auto">
              {[...calledNumbers].reverse().map((n, i) => (
                <span key={n} className="num-pill" style={{ opacity: i === 0 ? 1 : 0.6 - i * 0.03 }}>
                  {n}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* BINGO columns visual */}
        {calledNumbers.length > 0 && (
          <div className="glass-card p-5 mb-4">
            <h3 className="font-bold text-sm text-gold mb-3">Distribución BINGO</h3>
            <div className="grid grid-cols-5 gap-2">
              {cols.map((col, ci) => {
                const range = calledNumbers.filter(n => Math.floor((n - 1) / 15) === ci);
                return (
                  <div key={col} className="text-center">
                    <div className="font-display font-black text-sm mb-2" style={{ color: ['#F5C518','#22A870','#FFE57A','#F5C518','#22A870'][ci] }}>{col}</div>
                    <div className="space-y-1">
                      {range.slice(-4).map(n => (
                        <div key={n} className="text-xs bg-gold/10 border border-gold/20 rounded-full py-0.5 font-bold text-gold/80">{n}</div>
                      ))}
                    </div>
                    <div className="text-xs text-white/30 mt-1">{range.length}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Manual winner declaration */}
        <div className="glass-card p-5 mb-4">
          <h3 className="font-bold text-sm text-gold mb-3">🏆 Declarar Ganador Manual</h3>
          <div className="flex gap-2">
            <input
              className="input-gold flex-1"
              placeholder="ID del ganador"
              value={manualWinnerId}
              onChange={e => setManualWinnerId(e.target.value)}
            />
            <button className="btn-gold px-4 py-2 text-sm" onClick={() => declareWinner(manualWinnerId)}>
              ✓
            </button>
          </div>
        </div>

        {/* Winner display if any */}
        {winnerId && (
          <div className="glass-card p-5 mb-4 border-gold/40" style={{ borderColor: 'rgba(245,197,24,0.4)' }}>
            <div className="text-center">
              <div className="text-4xl mb-2">🏆</div>
              <p className="font-display text-xl font-black text-gold-gradient">¡GANADOR!</p>
              <p className="text-white font-bold mt-1">{winnerId}</p>
            </div>
          </div>
        )}

        {/* DB status */}
        <div className="text-center py-2 mb-4">
          <span className={`text-xs ${dbReady ? 'text-emerald-light' : 'text-yellow-400'}`}>
            {dbReady ? '🔥 Firebase conectado' : '⚡ Conectando a Firebase...'}
          </span>
        </div>
      </div>
    </div>
  );
}

// ADMIN LOGIN
function AdminLogin({ onSuccess, onBack }) {
  const [pwd, setPwd] = useState('');
  const [error, setError] = useState('');

  const check = () => {
    if (pwd === ADMIN_PASSWORD) { onSuccess(); }
    else { setError('Contraseña incorrecta'); }
  };

  return (
    <div className="min-h-screen bg-animated flex flex-col items-center justify-center px-6">
      <div className="glass-card p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <span className="text-4xl">⚙️</span>
          <h2 className="font-display text-2xl font-black text-gold mt-2">Acceso Admin</h2>
          <p className="text-xs text-white/40 mt-1">Solo personal autorizado</p>
        </div>
        <input
          type="password"
          className="input-gold mb-3"
          placeholder="Contraseña"
          value={pwd}
          onChange={e => setPwd(e.target.value)}
          onKeyPress={e => e.key === 'Enter' && check()}
        />
        {error && <p className="text-red-400 text-xs mb-3">{error}</p>}
        <button className="btn-gold w-full mb-3" onClick={check}>Entrar</button>
        <button className="btn-emerald w-full text-sm" onClick={onBack}>← Volver</button>
      </div>
    </div>
  );
}

// TAB BAR
function TabBar({ activeTab, onTabChange }) {
  return (
    <div className="tab-bar">
      <div className="flex justify-around items-center max-w-sm mx-auto">
        <button
          className={`flex flex-col items-center gap-1 py-2 px-6 rounded-xl transition-all ${activeTab === 'user' ? 'text-gold' : 'text-white/40'}`}
          onClick={() => onTabChange('user')}
        >
          <span className="text-xl">🎱</span>
          <span className="text-xs font-semibold">Mi Cartón</span>
        </button>
        <button
          className={`flex flex-col items-center gap-1 py-2 px-6 rounded-xl transition-all ${activeTab === 'admin' ? 'text-gold' : 'text-white/40'}`}
          onClick={() => onTabChange('admin')}
        >
          <span className="text-xl">⚙️</span>
          <span className="text-xs font-semibold">Admin</span>
        </button>
      </div>
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('login');     // login | user | adminLogin | admin
  const [userId, setUserId] = useState('');
  const [activeTab, setActiveTab] = useState('user');
  const [calledNumbers, setCalledNumbers] = useState([]);
  const [gameState, setGameState] = useState('idle');
  const [winnerId, setWinnerId] = useState(null);
  const [showWinner, setShowWinner] = useState(false);
  const prevWinnerId = useRef(null);

  // Escuchar Firestore en tiempo real (para usuarios también)
  useEffect(() => {
    if (screen !== 'user' && screen !== 'admin') return;
    let unsubscribe;
    const setup = async () => {
      try {
        if (!db) await initFirebase();
        const { onSnapshot, doc } = fsLib;
        unsubscribe = onSnapshot(doc(db, 'juego_actual', 'estado'), (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            setCalledNumbers(data.numeros || []);
            setGameState(data.estado || 'idle');
            // Detectar ganador nuevo
            if (data.ganador && data.ganador !== prevWinnerId.current) {
              prevWinnerId.current = data.ganador;
              setWinnerId(data.ganador);
              setShowWinner(true);
            }
          }
        });
      } catch (e) {
        console.warn('Firebase listener error:', e);
      }
    };
    setup();
    return () => { if (unsubscribe) unsubscribe(); };
  }, [screen]);

  // Auto-detect bingo
  useEffect(() => {
    if (!userId || calledNumbers.length === 0) return;
    const card = seudoCardFromId(userId);
    const calledSet = new Set(calledNumbers);
    if (checkBingo(card, calledSet) && !winnerId) {
      // Notificar ganador automáticamente
      const notify = async () => {
        try {
          if (!db || !fsLib) return;
          const { doc, updateDoc } = fsLib;
          await updateDoc(doc(db, 'juego_actual', 'estado'), {
            ganador: userId,
            estado: 'ended'
          });
        } catch (e) { console.error(e); }
      };
      notify();
    }
  }, [calledNumbers, userId]);

  const handleTabChange = (tab) => {
    setActiveTab(tab);
    if (tab === 'admin') {
      setScreen('adminLogin');
    } else {
      setScreen('user');
    }
  };

  const handleLogin = (id) => {
    setUserId(id);
    setScreen('user');
  };

  const handleAdminAuth = () => {
    setScreen('admin');
    setActiveTab('admin');
  };

  return (
    <>
      {/* WINNER OVERLAY */}
      {showWinner && winnerId && (
        <WinnerOverlay winnerId={winnerId} onClose={() => setShowWinner(false)} />
      )}

      {/* SCREENS */}
      {screen === 'login' && (
        <LoginView onLogin={handleLogin} />
      )}

      {screen === 'user' && (
        <>
          <UserView
            userId={userId}
            calledNumbers={calledNumbers}
            gameState={gameState}
            winnerId={winnerId}
          />
          <TabBar activeTab={activeTab} onTabChange={handleTabChange} />
        </>
      )}

      {screen === 'adminLogin' && (
        <AdminLogin
          onSuccess={handleAdminAuth}
          onBack={() => { setScreen('user'); setActiveTab('user'); }}
        />
      )}

      {screen === 'admin' && (
        <>
          <AdminView
            onLogout={() => { setScreen('user'); setActiveTab('user'); }}
          />
          <TabBar activeTab={activeTab} onTabChange={handleTabChange} />
        </>
      )}
    </>
  );
}

// ─── Mount ───────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
