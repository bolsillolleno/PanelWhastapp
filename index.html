// ─── Bingo engine ──────────────────────────────────────────────────────────
const RANGES = {B:[1,15],I:[16,30],N:[31,45],G:[46,60],O:[61,75]};
const LETTERS = ['B','I','N','G','O'];

function getBallLetter(n){ if(n<=15)return'B';if(n<=30)return'I';if(n<=45)return'N';if(n<=60)return'G';return'O'; }
function getBallColor(n){  if(n<=15)return'#3b82f6';if(n<=30)return'#ef4444';if(n<=45)return'#9ca3af';if(n<=60)return'#22c55e';return'#eab308'; }

function randRange(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function generateCard(){
  const card=[];
  for(let c=0;c<5;c++){
    const [a,b]=Object.values(RANGES)[c];
    const pool=[...Array(b-a+1)].map((_,i)=>a+i);
    const col=[];
    for(let r=0;r<5;r++){
      if(r===2&&c===2){col.push(null);continue;}
      const idx=Math.floor(Math.random()*pool.length);
      col.push(pool.splice(idx,1)[0]);
    }
    card.push(col);
  }
  return card;
}
function generateSheet(drawId,cardsPerSheet,purchaseId,accessId){
  const cards=[];
  for(let i=0;i<cardsPerSheet;i++) cards.push({numbers:generateCard()});
  return{drawId,cards,purchaseId,accessId,createdAt:Date.now()};
}
function drawRandomBall(drawn){
  const rem=Array.from({length:75},(_,i)=>i+1).filter(b=>!drawn.includes(b));
  if(!rem.length)throw new Error('Todas las balotas sorteadas');
  return rem[Math.floor(Math.random()*rem.length)];
}
function checkWin(card,drawn,type){
  const s=new Set(drawn);
  const m=(c,r)=>{ const v=card[c][r]; return v===null||s.has(v); };
  const check=cells=>cells.every(([c,r])=>m(c,r));
  switch(type){
    case'horizontal_line': return [[0,1,2,3,4]].map(r=>r.map(c=>[c,0])).concat(
      [0,1,2,3,4].map(r=>[[0,r],[1,r],[2,r],[3,r],[4,r]])).some(check);
    case'vertical_line':   return [0,1,2,3,4].map(c=>[[c,0],[c,1],[c,2],[c,3],[c,4]]).some(check);
    case'diagonal':        return check([[0,0],[1,1],[2,2],[3,3],[4,4]])||check([[4,0],[3,1],[2,2],[1,3],[0,4]]);
    case'four_corners':    return check([[0,0],[4,0],[0,4],[4,4]]);
    case'cross':           return check([[2,0],[2,1],[2,2],[2,3],[2,4],[0,2],[1,2],[3,2],[4,2]]);
    case'full_card':       for(let c=0;c<5;c++)for(let r=0;r<5;r++)if(!m(c,r))return false;return true;
    default: return false;
  }
}

    S.purchases = snap.exists() ? snap.val() : {};

    render();

  onValue(ref(db,'sheets'),   snap=>{ S.sheets  =snap.exists()?snap.val():{};  render(); });
  onValue(ref(db,'gameState'),snap=>{
    if(snap.exists()) S.gameState={...S.gameState,...snap.val()};
    render();
  });
  onValue(ref(db,'settings'), snap=>{ if(snap.exists()) S.settings={...S.settings,...snap.val()}; render(); });
}

async function rtSet(path,val){  await set(ref(db,path),val); }
async function rtUpd(path,val){  await update(ref(db,path),val); }
async function rtPush(path,val){ const r=await push(ref(db,path),val); return r.key; }

function renderCard(card,drawn,si,ci){
  const nums=card.numbers||card;
  const won=['horizontal_line','vertical_line','diagonal','four_corners','cross','full_card']
    .some(t=>checkWin(nums,drawn,t));
  return`<div class="bingo-card ${won?'won':''}">
    ${won?`<div class="win-banner">🎉 ¡BINGO!</div>`:''}
    <div class="bingo-hdr">${['B','I','N','G','O'].map(l=>`<div>${l}</div>`).join('')}</div>
    <div class="bingo-grid">
      ${Array.from({length:5},(_,row)=>Array.from({length:5},(_,col)=>{
        const v=nums[col][row];
        const mk=v===null||new Set(drawn).has(v);
        return`<div class="bc ${mk?'mk':''} ${v===null?'fr':''}">${v===null?'★':v}</div>`;
      }).join('')).join('')}
    </div>
  </div>`;
}

// ─── BIND EVENTS ─────────────────────────────────────────────────────────────
function bind(){
  // Nav
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.nav)));

  // Logout
  document.getElementById('btn-logout')?.addEventListener('click',async()=>{ await signOut(auth); nav('home'); });

  // Login
  document.getElementById('btn-login')?.addEventListener('click',async()=>{
    const e2=document.getElementById('l-email').value;
    const p2=document.getElementById('l-pass').value;
    const er=document.getElementById('l-err');
    try{ await signInWithEmailAndPassword(auth,e2,p2); nav('admin'); }
    catch(e){ er.textContent=e.message; er.classList.remove('hidden'); }
  });

  // Qty pickers en comprar
  document.querySelectorAll('[data-minus]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.minus;
    if(!S.qty[id]||S.qty[id]<=1) S.qty[id]=1; else S.qty[id]--;
    updateQtyUI(id);
  }));
  document.querySelectorAll('[data-plus]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.plus;
    S.qty[id]=(S.qty[id]||1)+1;
    updateQtyUI(id);
  }));
  document.querySelectorAll('[data-checkout]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.checkout;
    const draw={id,...S.draws[id]};
    S.checkoutDraw=draw; S.checkoutSheets=S.qty[id]||1; nav('checkout');
  }));

  // Checkout submit
  document.getElementById('btn-co-submit')?.addEventListener('click',async()=>{
    const name=document.getElementById('co-name').value.trim();
    const phone=document.getElementById('co-phone').value.trim();
    const cid=document.getElementById('co-id').value.trim();
    const msg=document.getElementById('co-msg');
    if(!name||!phone||!cid){ showMsg(msg,'Completa todos los campos.','err'); return; }
    try{
      const draw=S.checkoutDraw;
      const n=S.checkoutSheets;
      const pps=Number(draw.pricePerSheet||4000);
      const cps=Number(draw.cardsPerSheet||6);
      const total=pps*n;
      const pid=await rtPush('purchases',{customerName:name,customerPhone:phone,customerId:cid,
        drawId:draw.id,sheetCount:n,totalCards:cps*n,totalPrice:total,status:'pending',createdAt:Date.now()});
      const wa=S.settings.whatsappNumber||'573001234567';
      const txt=encodeURIComponent(`*Hola! Quiero comprar hojas de Bingo* 🎱\n\n*Sorteo:* ${draw.name}\n*Nombre:* ${name}\n*Teléfono:* ${phone}\n*Cédula:* ${cid}\n*Hojas:* ${n}\n*Cartones:* ${cps*n}\n*Total:* $${total.toLocaleString('es-CO')}\n*ID Compra:* ${pid}\n\nAdjunto comprobante de pago.`);
      window.open(`https://wa.me/${wa}?text=${txt}`,'_blank');
      showMsg(msg,'¡Solicitud enviada! Continúa por WhatsApp.','ok');
    } catch(e){ showMsg(msg,e.message,'err'); }
  });

  // Play login
  document.getElementById('btn-play-login')?.addEventListener('click',()=>{
    const v=document.getElementById('play-acc').value.trim();
    if(v){ S.accessId=v; S.isAuthenticated=true; localStorage.setItem('bl_acc',v); render(); }
  });
  document.getElementById('btn-play-logout')?.addEventListener('click',()=>{
    S.isAuthenticated=false; S.accessId=''; localStorage.removeItem('bl_acc'); render();
  });

  // Admin tabs
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ S.adminTab=el.dataset.tab; render(); }));

  // Draws admin
  document.getElementById('btn-show-df')?.addEventListener('click',()=>document.getElementById('df-wrap')?.classList.toggle('hidden'));
  document.getElementById('btn-cancel-df')?.addEventListener('click',()=>document.getElementById('df-wrap')?.classList.add('hidden'));
  document.getElementById('btn-save-draw')?.addEventListener('click',async()=>{
    const name=document.getElementById('df-name').value.trim();
    const desc=document.getElementById('df-desc').value.trim();
    const date=document.getElementById('df-date').value;
    const time=document.getElementById('df-time').value;
    const price=parseInt(document.getElementById('df-price').value)||4000;
    const cards=parseInt(document.getElementById('df-cards').value)||6;
    if(!name||!date||!time){ alert('Completa nombre, fecha y hora'); return; }
    await rtPush('draws',{name,description:desc,date,time,pricePerSheet:price,cardsPerSheet:cards,status:'scheduled',createdAt:Date.now()});
    document.getElementById('df-wrap')?.classList.add('hidden');
  });
  document.querySelectorAll('[data-del-draw]').forEach(el=>el.addEventListener('click',async()=>{
    if(confirm('¿Eliminar sorteo?')) await rtDel('draws/'+el.dataset.delDraw);
  }));

  // Purchases admin
  document.querySelectorAll('[data-confirm]').forEach(el=>el.addEventListener('click',async()=>{
    const pid=el.dataset.confirm;
    const p=S.purchases[pid]; if(!p) return;
    const accessId=`BL_${Date.now()}_${Math.random().toString(36).substr(2,6).toUpperCase()}`;
    const draw=S.draws[p.drawId];
    if(draw){
      const sheet=generateSheet(p.drawId,Number(draw.cardsPerSheet||6),pid,accessId);
      await rtPush('sheets',sheet);
    }
    await rtUpd('purchases/'+pid,{status:'confirmed',accessId,confirmedAt:Date.now()});
  }));
  document.querySelectorAll('[data-reject]').forEach(el=>el.addEventListener('click',async()=>{
    await rtUpd('purchases/'+el.dataset.reject,{status:'rejected'});
  }));
  document.querySelectorAll('[data-wa]').forEach(el=>el.addEventListener('click',()=>{
    const p=S.purchases[el.dataset.wa]; if(!p||!p.accessId) return;
    const txt=encodeURIComponent(`✅ *¡Tu compra fue confirmada!*\n\n*ID de Acceso:* \`${p.accessId}\`\n\nEntra a la app y en la sección *Jugar* ingresa este código para ver tus cartones. ¡Buena suerte! 🍀🎱`);
    window.open(`https://wa.me/${p.customerPhone}?text=${txt}`,'_blank');
  }));

  // Game control
  document.getElementById('btn-start')?.addEventListener('click',async()=>{
    const drawId=document.getElementById('sel-draw')?.value;
    const speed=parseInt(document.getElementById('inp-speed')?.value)||5;
    if(!drawId){ alert('Selecciona un sorteo'); return; }
    await rtUpd('draws/'+drawId,{status:'live',startedAt:Date.now()});
    await rtSet('gameState',{currentDrawId:drawId,status:'drawing',drawnBalls:[],currentBall:null,ballSpeed:speed,lastDrawTime:Date.now()});
  });
  document.getElementById('btn-draw-ball')?.addEventListener('click',async()=>{
    const ball=drawRandomBall(S.gameState.drawnBalls||[]);
    const newDrawn=[...(S.gameState.drawnBalls||[]),ball];
    await rtUpd('gameState',{currentBall:ball,drawnBalls:newDrawn,lastDrawTime:Date.now()});
    if(S.gameState.currentDrawId) await rtUpd('draws/'+S.gameState.currentDrawId,{currentBall:ball,drawnBalls:newDrawn});
  });
  document.getElementById('btn-pause')?.addEventListener('click',async()=>  await rtUpd('gameState',{status:'paused'}));
  document.getElementById('btn-resume')?.addEventListener('click',async()=> await rtUpd('gameState',{status:'drawing'}));
  document.getElementById('btn-finish')?.addEventListener('click',async()=>{
    if(!confirm('¿Finalizar el sorteo?')) return;
    if(S.gameState.currentDrawId) await rtUpd('draws/'+S.gameState.currentDrawId,{status:'finished',finishedAt:Date.now()});
    await rtSet('gameState',{status:'waiting',currentDrawId:null,currentBall:null,drawnBalls:[],ballSpeed:5});
  });

  // Patterns admin
  document.getElementById('btn-show-pf')?.addEventListener('click',()=>document.getElementById('pf-wrap')?.classList.toggle('hidden'));
  document.getElementById('btn-cancel-pf')?.addEventListener('click',()=>document.getElementById('pf-wrap')?.classList.add('hidden'));
  document.getElementById('btn-save-pat')?.addEventListener('click',async()=>{
    const name=document.getElementById('pf-name').value.trim();
    const type=document.getElementById('pf-type').value;
    const prize=parseInt(document.getElementById('pf-prize').value)||100000;
    const desc=document.getElementById('pf-desc').value.trim();
    if(!name){ alert('Ingresa un nombre'); return; }
    await rtPush('patterns',{name,type,prize,description:desc,createdAt:Date.now()});
    document.getElementById('pf-wrap')?.classList.add('hidden');
  });
  document.querySelectorAll('[data-del-pat]').forEach(el=>el.addEventListener('click',async()=>{
    if(confirm('¿Eliminar figura?')) await rtDel('patterns/'+el.dataset.delPat);
  }));
  document.getElementById('btn-init-pat')?.addEventListener('click',async()=>{
    const defs=[
      {name:'Línea Horizontal',type:'horizontal_line',prize:100000,description:'Cualquier línea horizontal'},
      {name:'Línea Vertical',type:'vertical_line',prize:100000,description:'Cualquier línea vertical'},
      {name:'Diagonal',type:'diagonal',prize:100000,description:'Cualquier diagonal'},
      {name:'Cuatro Esquinas',type:'four_corners',prize:200000,description:'Las 4 esquinas'},
      {name:'Cruz',type:'cross',prize:300000,description:'Cruz central'},
      {name:'Cartón Lleno',type:'full_card',prize:1000000,description:'Todos los números'},
    ];
    for(const p of defs) await rtPush('patterns',p);
  });

  // Settings
  document.getElementById('btn-save-settings')?.addEventListener('click',async()=>{
    await rtSet('settings',{
      whatsappNumber:document.getElementById('s-wa').value.trim(),
      bankName:document.getElementById('s-bank').value.trim(),
      bankAccount:document.getElementById('s-acc').value.trim(),
      accountHolder:document.getElementById('s-holder').value.trim(),
      pricePerSheet:parseInt(document.getElementById('s-price').value)||4000,
      cardsPerSheet:parseInt(document.getElementById('s-cph').value)||6,
    });
    alert('✅ Configuración guardada');
  });
}

// ─── UI helpers ──────────────────────────────────────────────────────────────
function showMsg(el,txt,type){
  el.textContent=txt;
  el.className=type==='ok'?'ok-msg':'err-msg';
  el.classList.remove('hidden');
}
function updateQtyUI(id){
  const draw=S.draws[id]; if(!draw) return;
  const qty=S.qty[id]||1;
  const pps=Number(draw.pricePerSheet||4000);
  const cps=Number(draw.cardsPerSheet||6);
  const qv=document.getElementById('qv-'+id);
  const qi=document.getElementById('qi-'+id);
  if(qv) qv.textContent=qty;
  if(qi) qi.innerHTML=`${cps*qty} cartones · <strong class="gold">$${(pps*qty).toLocaleString('es-CO')}</strong>`;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
const stored=localStorage.getItem('bl_acc');
if(stored){ S.accessId=stored; S.isAuthenticated=true; }

initListeners();
render();
</script>

<style>

/* GRIDS */

/* CARD */

.white{color:var(--white)} .gray{color:var(--gray)} .green{color:var(--green)}

.hidden{display:none!important} .w-full{width:100%}

/* FOOTER */

@media(max-width:768px){
  .draw-display{grid-template-columns:1fr}
  .bc{width:34px;height:34px;font-size:.7rem}
}
