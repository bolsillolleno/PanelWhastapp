<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bol$illo Lleno – Bingo Online</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{

  --bg:#07070e;--bg2:#0d0d18;--bg3:#131320;

  --card:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.07);

  --gold:#f0b429;--gold2:#fcd34d;--gold3:#b45309;

  --white:#f1f0ed;--gray:#8b8fa8;--dim:#3d4060;

  --green:#10b981;--red:#f43f5e;--blue:#6366f1;--yellow:#f59e0b;

  --r:10px;--rsm:6px;--rlg:16px;

}

html,body{min-height:100%;background:var(--bg);color:var(--white);font-family:'Syne',sans-serif;line-height:1.55}

button{cursor:pointer;font-family:'Syne',sans-serif;border:none;outline:none}

input,select,textarea{font-family:'Syne',sans-serif}

::-webkit-scrollbar{width:4px}

::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}



/* ── NAVBAR ── */

.navbar{position:sticky;top:0;z-index:100;height:58px;background:rgba(7,7,14,0.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center}

.nav-inner{width:100%;max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}

.logo-btn{background:none;border:none;cursor:pointer;padding:0}

.logo-text{font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.02em}

.nav-links{display:flex;align-items:center;gap:2px}

.nav-link{background:none;border:none;padding:5px 12px;border-radius:var(--rsm);color:var(--gray);font-size:.82rem;font-weight:600;transition:all .15s;white-space:nowrap}

.nav-link:hover{color:var(--white)}

.nav-link.active{color:var(--gold);background:rgba(240,180,41,.08)}



/* ── LAYOUT ── */

.main{min-height:calc(100vh - 58px)}

.pw{max-width:960px;margin:0 auto;padding:2rem 1.5rem}

.pw.narrow{max-width:720px}

.pw.wide{max-width:1200px}

.section{max-width:1200px;margin:0 auto;padding:4rem 1.5rem}

.stitle{text-align:center;margin-bottom:3rem}

.stitle h2{font-size:1.85rem;font-weight:800;margin-bottom:.4rem}

.stitle p{color:var(--gray);font-size:.9rem}



/* ── CARDS ── */

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rlg);padding:1.5rem}

.card.gl{background:rgba(255,255,255,.025);backdrop-filter:blur(8px)}



/* ── BUTTONS ── */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.55rem 1.1rem;border-radius:var(--rsm);font-weight:700;font-size:.82rem;transition:all .15s;border:none;cursor:pointer;white-space:nowrap;font-family:'Syne',sans-serif}

.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#000}

.btn-g:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 18px rgba(240,180,41,.3)}

.btn-g:active{transform:none;filter:none}

.btn-o{background:transparent;border:1px solid var(--border);color:var(--white)}

.btn-o:hover{border-color:var(--gold);color:var(--gold)}

.btn-r{background:var(--red);color:#fff}

.btn-r:hover{filter:brightness(1.1)}

.btn-gr{background:var(--green);color:#000;font-weight:800}

.btn-gr:hover{filter:brightness(1.1)}

.btn-gy{background:rgba(255,255,255,.08);color:var(--white)}

.btn-gy:hover{background:rgba(255,255,255,.13)}

.btn-sm{padding:.3rem .75rem;font-size:.76rem}

.btn-lg{padding:.72rem 1.6rem;font-size:.9rem}

.btn-xl{padding:.9rem 2.2rem;font-size:1rem;border-radius:var(--r)}

.btn-full{width:100%;justify-content:center}

.btn-back{background:none;border:none;color:var(--dim);font-size:.82rem;display:inline-flex;align-items:center;gap:4px;margin-bottom:1rem;cursor:pointer;transition:color .15s;font-family:'Syne',sans-serif;font-weight:600}

.btn-back:hover{color:var(--white)}



/* ── INPUTS ── */

.inp{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--rsm);padding:.6rem .85rem;color:var(--white);font-size:.85rem;width:100%;transition:all .15s;font-family:'Syne',sans-serif}

.inp:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.07)}

.inp::placeholder{color:var(--dim)}

select.inp option{background:var(--bg2);color:var(--white)}

.inp-pre{display:flex}

.inp-pre .pre{background:rgba(255,255,255,.07);border:1px solid var(--border);border-right:none;border-radius:var(--rsm) 0 0 var(--rsm);padding:0 .85rem;display:flex;align-items:center;color:var(--gray);font-size:.85rem;white-space:nowrap;font-family:'Space Mono',monospace;font-weight:700}

.inp-pre input{border-radius:0 var(--rsm) var(--rsm) 0;flex:1}

label,.lbl{display:block;font-size:.78rem;color:var(--gray);margin-bottom:.3rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}

.fg{margin-bottom:.9rem}

.fgrow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

@media(max-width:600px){.fgrow{grid-template-columns:1fr}}



/* ── BADGES ── */

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;font-family:'Space Mono',monospace}

.b-red{background:rgba(244,63,94,.1);color:#fb7185;border:1px solid rgba(244,63,94,.2)}

.b-yel{background:rgba(245,158,11,.1);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}

.b-grn{background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.2)}

.b-gy{background:rgba(255,255,255,.05);color:var(--gray);border:1px solid var(--border)}

.b-blu{background:rgba(99,102,241,.1);color:#818cf8;border:1px solid rgba(99,102,241,.2)}



/* ── UTILS ── */

.gold{color:var(--gold)}.white{color:var(--white)}.gray{color:var(--gray)}.grn{color:var(--green)}.red{color:var(--red)}

.sm{font-size:.8rem}.xs{font-size:.72rem}

.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}.fw9{font-weight:900}

.tc{text-align:center}.tr{text-align:right}

.mb05{margin-bottom:.5rem}.mb1{margin-bottom:1rem}.mb15{margin-bottom:1.5rem}.mb2{margin-bottom:2rem}

.mt05{margin-top:.5rem}.mt1{margin-top:1rem}.mt2{margin-top:2rem}

.w-full{width:100%}

.flex{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}

.flex-b{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}

.vlist{display:flex;flex-direction:column;gap:.85rem}

.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}

.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

@media(max-width:600px){.g4,.g3,.g2,.g5{grid-template-columns:1fr}}

.sep{height:1px;background:var(--border);margin:1.25rem 0}

.loading{text-align:center;padding:4rem;color:var(--gray);font-size:1rem}

.empty{text-align:center;padding:2.5rem;color:var(--gray)}

.hidden{display:none!important}

.rel{position:relative}



/* ── HERO ── */

.hero{padding:5rem 1.5rem 4rem;position:relative;overflow:hidden}

.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(240,180,41,.06),transparent)}

.hero-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 40% 30% at 20% 80%,rgba(99,102,241,.04),transparent)}

.hero-inner{max-width:660px;margin:0 auto;text-align:center;position:relative}

.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.2);border-radius:999px;color:var(--gold);font-size:.75rem;font-weight:700;margin-bottom:1.5rem;font-family:'Space Mono',monospace;letter-spacing:.04em}

.hero-title{font-size:3rem;font-weight:800;line-height:1.08;letter-spacing:-.03em;margin-bottom:1rem}

.hero-title .dim{color:var(--gray);font-weight:400}

.hero-sub{color:var(--gray);font-size:.95rem;max-width:460px;margin:0 auto 2rem}

.hero-btns{display:flex;gap:.85rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem}

.hero-stats{display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}

.hstat{text-align:center}

.hstat-n{font-size:1.6rem;font-weight:800;color:var(--gold);font-family:'Space Mono',monospace}

.hstat-l{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

.hstat-sep{width:1px;height:32px;background:var(--border)}

@media(max-width:600px){.hero-title{font-size:2rem}}



/* ── MINI BOARD ── */

.mini-board{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:66px;margin:.65rem auto 0}

.mini-cell{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,.05)}

.mini-cell.on{background:var(--gold)}



/* ── DRAW CARD ── */

.draw-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}

.price-tag{text-align:right;flex-shrink:0}

.qty-row{display:flex;align-items:center;gap:.65rem;margin:.5rem 0;flex-wrap:wrap}

.qty-btn{width:28px;height:28px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:5px;color:var(--white);font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:'Space Mono',monospace}

.qty-btn:hover{background:rgba(255,255,255,.13)}

.qty-val{font-weight:700;min-width:20px;text-align:center;font-family:'Space Mono',monospace}



/* ── CHECKOUT ── */

.co-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem}

@media(max-width:660px){.co-grid{grid-template-columns:1fr}}

.sr{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--border)}

.sr:last-child{border:none}

.sr-total{padding-top:.85rem;margin-top:.5rem;border-top:1px solid var(--border)}



/* ── BINGO CARD ── */

.bc-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .3s,box-shadow .3s}

.bc-wrap.wglow{border-color:var(--gold)!important;box-shadow:0 0 22px rgba(240,180,41,.2)}

.bc-cn{font-size:.68rem;color:var(--dim);text-align:right;padding:3px 7px;font-weight:700;letter-spacing:.04em;font-family:'Space Mono',monospace}

.bc-hdrs{display:grid;grid-template-columns:repeat(5,1fr)}

.bc-h{padding:4px;text-align:center;font-weight:800;font-size:.82rem;font-family:'Space Mono',monospace}

.bc-h.B{background:rgba(59,130,246,.18);color:#60a5fa}

.bc-h.I{background:rgba(244,63,94,.18);color:#fb7185}

.bc-h.N{background:rgba(148,163,184,.18);color:#cbd5e1}

.bc-h.G{background:rgba(16,185,129,.18);color:#34d399}

.bc-h.O{background:rgba(240,180,41,.18);color:#fcd34d}

.bc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:2px;background:rgba(0,0,0,.3)}

.bc-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;background:var(--bg3);border-radius:3px;transition:all .2s;font-family:'Space Mono',monospace}

.bc-cell.fhi{box-shadow:inset 0 0 0 2px var(--gold)}

.bc-cell.hit.B{background:#3b82f6;color:#fff}

.bc-cell.hit.I{background:#f43f5e;color:#fff}

.bc-cell.hit.N{background:#475569;color:#fff}

.bc-cell.hit.G{background:#10b981;color:#000}

.bc-cell.hit.O{background:#f0b429;color:#000}

.bc-cell.ctr{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25)}

.bc-cell.ctr .cn{font-size:.6rem;font-weight:800;color:var(--gold);font-family:'Space Mono',monospace}



/* ── FIGURE CREATOR ── */

.fec-grid{display:inline-grid;grid-template-columns:repeat(5,56px);gap:4px}

.fec-hdr{height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;border-radius:5px;font-family:'Space Mono',monospace}

.fec-hdr.B{background:rgba(59,130,246,.15);color:#60a5fa}

.fec-hdr.I{background:rgba(244,63,94,.15);color:#fb7185}

.fec-hdr.N{background:rgba(148,163,184,.15);color:#cbd5e1}

.fec-hdr.G{background:rgba(16,185,129,.15);color:#34d399}

.fec-hdr.O{background:rgba(240,180,41,.15);color:#fcd34d}

.fec-cell{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:rgba(255,255,255,.05);border:2px solid transparent;cursor:pointer;transition:all .12s;font-size:.68rem;font-weight:700;font-family:'Space Mono',monospace}

.fec-cell:hover:not(.fec-ctr){background:rgba(255,255,255,.1);border-color:rgba(240,180,41,.35)}

.fec-cell.fec-on{background:rgba(240,180,41,.18);border-color:var(--gold);color:var(--gold)}

.fec-cell.fec-ctr{background:rgba(240,180,41,.07);border-color:rgba(240,180,41,.18);cursor:not-allowed;color:var(--gold)}



/* ── FIGURE SLOTS ── */

.fig-slots{display:grid;grid-template-columns:repeat(5,1fr);gap:.85rem}

@media(max-width:700px){.fig-slots{grid-template-columns:repeat(2,1fr)}}

.fig-slot{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem;text-align:center;cursor:pointer;transition:all .18s}

.fig-slot:hover{border-color:rgba(240,180,41,.3);transform:translateY(-2px)}

.fig-slot.has-fig{border-color:rgba(240,180,41,.18);background:rgba(240,180,41,.025)}

.fig-slot.ae{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,180,41,.12)}

.fs-ord{font-size:.66rem;color:var(--dim);font-weight:700;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Mono',monospace}

.fs-name{font-size:.78rem;font-weight:700;color:var(--white);margin-top:.35rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fs-prize{font-size:.78rem;font-weight:700;color:var(--gold);font-family:'Space Mono',monospace}

.fig-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;width:42px;margin:.4rem auto;aspect-ratio:1}

.fmc{border-radius:1px;background:rgba(255,255,255,.06);aspect-ratio:1}

.fmc.on{background:var(--gold)}



/* ── TRANSMISSION ── */

.tx{min-height:calc(100vh - 58px);display:flex;flex-direction:column;background:var(--bg)}



/* waiting */

.tx-wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}



/* announcing */

.tx-ann{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;padding:2rem;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(240,180,41,.05),transparent);animation:fadeIn .5s ease}

.tx-ann-ord{font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-family:'Space Mono',monospace}

.tx-ann-name{font-size:2.4rem;font-weight:800;color:var(--white);line-height:1.1;text-align:center}

.tx-ann-prize{font-size:3rem;font-weight:800;color:var(--gold);font-family:'Space Mono',monospace;line-height:1}

.tx-ann-card{max-width:260px;width:100%}

.tx-ann-sub{color:var(--dim);font-size:.82rem}



/* playing */

.tx-play{flex:1;display:grid;grid-template-columns:190px 1fr 210px;gap:1rem;padding:1.25rem;align-items:start}

@media(max-width:860px){.tx-play{grid-template-columns:1fr;padding:1rem}}

.tx-left,.tx-right{display:flex;flex-direction:column;gap:.85rem}

.tx-fig-lbl{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-family:'Space Mono',monospace}

.tx-prize-box{background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.18);border-radius:var(--r);padding:.65rem;text-align:center}

.tx-prize-lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:.2rem;font-weight:700}

.tx-prize-amt{font-size:1.3rem;font-weight:800;color:var(--gold);font-family:'Space Mono',monospace}

.tx-center{display:flex;flex-direction:column;gap:.85rem;min-width:0}

.tx-ball-hist{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}

.chip{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0;font-family:'Space Mono',monospace}

.chip.B{background:#3b82f6;color:#fff}

.chip.I{background:#f43f5e;color:#fff}

.chip.N{background:#475569;color:#fff}

.chip.G{background:#10b981;color:#000}

.chip.O{background:#f0b429;color:#000}

.tx-right{align-items:center;justify-content:center}

.tx-bigball{width:148px;height:148px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:ballPop .4s ease}

.tx-bigball .bl{font-size:.85rem;font-weight:700;opacity:.85;font-family:'Space Mono',monospace}

.tx-bigball .bn{font-size:3rem;font-weight:800;line-height:1;font-family:'Space Mono',monospace}

.tx-count{font-size:.75rem;color:var(--dim);text-align:center;font-family:'Space Mono',monospace}



/* winner */

.tx-win{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(240,180,41,.07),transparent);animation:fadeIn .5s ease}

.tx-w-ic{font-size:4rem;animation:bounce .7s ease infinite alternate;margin-bottom:.5rem}

.tx-w-ttl{font-size:1.9rem;font-weight:800;color:var(--gold);margin-bottom:.25rem}

.tx-w-cn{font-size:3.8rem;font-weight:800;color:var(--white);line-height:1;margin-bottom:.2rem;font-family:'Space Mono',monospace}

.tx-w-nm{font-size:1.2rem;color:var(--gray);margin-bottom:.4rem}

.tx-w-pr{font-size:2.8rem;font-weight:800;color:var(--gold);font-family:'Space Mono',monospace}

.tx-w-fi{font-size:.82rem;color:var(--dim);margin-bottom:1.5rem}



/* finished */

.tx-fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}



/* ── ADMIN ── */

.adm-wrap{max-width:1200px;margin:0 auto;padding:1.5rem}

.atabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:1.5rem;padding-bottom:.65rem;border-bottom:1px solid var(--border)}

.atab{background:none;border:none;padding:5px 13px;border-radius:var(--rsm);color:var(--gray);font-size:.8rem;font-weight:700;transition:all .15s;font-family:'Syne',sans-serif}

.atab:hover{color:var(--white)}

.atab.active{color:var(--gold);background:rgba(240,180,41,.08)}

.a-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;gap:1rem;flex-wrap:wrap}

.a-hdr h2{font-size:1.25rem;font-weight:800}



/* stat cards */

.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.5rem}

@media(max-width:800px){.stat-cards{grid-template-columns:repeat(2,1fr)}}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem}

.stat-v{font-size:1.8rem;font-weight:800;margin-bottom:.15rem;font-family:'Space Mono',monospace;color:var(--gold)}

.stat-l{font-size:.72rem;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em}



/* table */

.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}

table{width:100%;border-collapse:collapse;font-size:.82rem}

th{text-align:left;padding:.65rem .9rem;color:var(--dim);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border)}

td{padding:.65rem .9rem;border-bottom:1px solid rgba(255,255,255,.025);vertical-align:middle}

tr:last-child td{border:none}

tr:hover td{background:rgba(255,255,255,.012)}

.td-acts{display:flex;gap:.4rem;align-items:center}



/* PLAY PAGE */

.play-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem;padding:1.5rem}



/* NOTIF */

.notif{position:fixed;bottom:1.25rem;right:1.25rem;padding:.75rem 1.1rem;border-radius:var(--r);font-weight:700;font-size:.82rem;z-index:999;box-shadow:0 4px 24px rgba(0,0,0,.4);animation:slideUp .3s ease;pointer-events:none;font-family:'Space Mono',monospace;max-width:320px}

.notif.ok{background:#052e16;border:1px solid rgba(16,185,129,.4);color:#34d399}

.notif.err{background:#4c0519;border:1px solid rgba(244,63,94,.4);color:#fb7185}

.notif.inf{background:#1e1b4b;border:1px solid rgba(99,102,241,.4);color:#818cf8}

/* ═══════════════════════════════════════════════ BINGO ENGINE */

// card[col][row], center = card[2][2] = cardNumber (special, always marked)

function genCard(cardNumber){

  const card=[];

  for(let col=0;col<5;col++){

    const[a,b]=RANGES[col];

    const pool=[];for(let i=a;i<=b;i++)pool.push(i);

    const col_arr=[];

    for(let row=0;row<5;row++){

      if(col===2&&row===2){col_arr.push(cardNumber);continue}

      const idx=Math.floor(Math.random()*pool.length);

      col_arr.push(pool.splice(idx,1)[0]);

    }

    card.push(col_arr);

  }

  return card;

}



// figureCells: flat 25-bool array, index=row*5+col

// card[col][row]. Center (col=2,row=2) is always considered marked.

function checkWin(card,drawn,figureCells){

  if(!figureCells)return false;

  const cells=toArr(figureCells);

  const s=new Set(drawn);

  for(let i=0;i<25;i++){

    if(!cells[i])continue;

    const col=i%5,row=Math.floor(i/5);

    if(col===2&&row===2)continue; // center always marked

    if(!s.has(card[col]?.[row]))return false;

  }

  return true;

}



function randBall(drawn){

  const rem=[];for(let i=1;i<=75;i++)if(!drawn.includes(i))rem.push(i);

  if(!rem.length)throw new Error('¡Todas las 75 balotas han sido sorteadas!');

  return rem[Math.floor(Math.random()*rem.length)];

}



function letter(n){if(n<=15)return'B';if(n<=30)return'I';if(n<=45)return'N';if(n<=60)return'G';return'O'}

function color(n){return BCOLORS[letter(n)]}

function toArr(v){if(!v)return[];if(Array.isArray(v))return v;return Object.values(v)}

function fmtCOP(n){return'$'+Number(n||0).toLocaleString('es-CO')}

function genAccessCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin 0/O/I/1 para evitar confusión
  let c='BL-';
  for(let i=0;i<6;i++)c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}



/* ═══════════════════════════════════════════════ ADMIN ACTIONS */

async function confirmPurchase(pid){

  const p=S.purchases[pid];

  if(!p||p.status!=='pending'){notify('Esta compra ya fue procesada','inf');return}

  const draw=S.draws[p.drawId];

  if(!draw){notify('Sorteo no encontrado','err');return}

  const numSheets=Number(p.quantity||1);

  const cps=Number(draw.cardsPerSheet||6);

  const accessCode=genAccessCode();

  let ss,cs;

  try{

    await runTransaction(fr(`draws/${p.drawId}/counters`),cur=>{

      const c=cur||{ns:1,nc:1};

      ss=c.ns;cs=c.nc;

      return{ns:c.ns+numSheets,nc:c.nc+numSheets*cps};

    });

    const upd={

      [`purchases/${pid}/status`]:'confirmed',

      [`purchases/${pid}/sheetStart`]:ss,

      [`purchases/${pid}/cardStart`]:cs,

      [`purchases/${pid}/accessCode`]:accessCode,

    };

    for(let s=0;s<numSheets;s++){

      const shN=ss+s;

      const cards=[];

      for(let c=0;c<cps;c++){

        const cN=cs+s*cps+c;

        cards.push({cardNumber:cN,numbers:genCard(cN)});

      }

      upd[`sheets/${p.drawId}_${shN}`]={drawId:p.drawId,sheetNumber:shN,purchaseId:pid,customerName:p.customerName,phone:p.phone,accessCode,cards,confirmedAt:Date.now()};

    }

    await update(fr('/'),upd);

    const lbl=numSheets>1?`Hojas #${ss} al #${ss+numSheets-1}`:`Hoja #${ss}`;

    S.lastConfirmedCode={code:accessCode,name:p.customerName,pid,lbl,
      phone:p.phone,drawName:draw.name,drawDate:draw.date||'',drawTime:draw.time||''};

    S.adminTab='compras';

    notify(`✓ ${lbl} asignadas · Código: ${accessCode}`,'ok');

    render();

  }catch(e){notify('Error: '+e.message,'err')}

}

async function saveEditPurchase(){

  if(!pid)return;
  const p=S.purchases[pid];
  if(!p){notify('Compra no encontrada','err');return}
  const name=document.getElementById('pe-name')?.value.trim();
  const rawPhone=document.getElementById('pe-phone')?.value.trim().replace(/\D/g,'');
  const qty=Number(document.getElementById('pe-qty')?.value)||p.quantity||1;
  const status=document.getElementById('pe-status')?.value||p.status;
  if(!name){notify('El nombre es requerido','err');return}
  const draw=S.draws[p.drawId];
  const pps=Number(draw?.pricePerSheet||0)||Math.round((p.total||0)/(p.quantity||1))||5000;
  const updates={customerName:name,status};
  if(rawPhone)updates.phone='+57'+rawPhone.replace(/^57/,'').slice(-10);
  if(p.status==='pending'){updates.quantity=qty;updates.total=pps*qty;}
  await rtUpd(`purchases/${pid}`,updates);
  S.editPur=null;
  notify('Compra actualizada ✓','ok');
  render();
}

/* ── TRANSMISSION CONTROLS ── */

async function txInit(drawId){

  await rtSet('gameState',{status:'waiting',currentDrawId:drawId,currentFigureIndex:0,currentBall:null,drawnBalls:[],currentWinner:null});

  await rtUpd(`draws/${drawId}`,{status:'live'});

}



async function txAnnounce(){

  const gs=S.gs;

  const fig=S.draws[gs.currentDrawId]?.figures?.[gs.currentFigureIndex];

  if(!fig){notify('Configura la figura antes de anunciar','err');return}

  await rtUpd('gameState',{status:'announcing_figure'});

}



async function txStartPlay(){

  await rtUpd('gameState',{status:'playing'});

}



async function txDraw(){

  const gs=S.gs;

  if(gs.status!=='playing')return;

  const drawn=toArr(gs.drawnBalls);

  try{

    const ball=randBall(drawn);

    const newDrawn=[...drawn,ball];

    await rtUpd('gameState',{currentBall:ball,drawnBalls:newDrawn});

    await checkAllWins(gs.currentDrawId,gs.currentFigureIndex,newDrawn);

  }catch(e){

    await rtUpd('gameState',{status:'no_winner'});

    notify(e.message,'inf');

  }

}



async function checkAllWins(drawId,figIdx,drawn){

  const draw=S.draws[drawId];

  if(!draw?.figures)return;

  const fig=draw.figures[figIdx];

  if(!fig)return;

  const cells=toArr(fig.cells);

  for(const[shId,sh]of Object.entries(S.sheets)){

    if(sh.drawId!==drawId)continue;

    const cards=toArr(sh.cards);

    for(const card of cards){

      const nums=toArr(card.numbers);

      if(checkWin(nums,drawn,cells)){

        await rtUpd('gameState',{

          status:'winner_found',

          currentWinner:{cardNumber:card.cardNumber,sheetNumber:sh.sheetNumber,customerName:sh.customerName,phone:sh.phone,prize:fig.prize,figureName:fig.name,figureIndex:figIdx}

        });

        await rtPush('winners',{drawId,drawName:draw.name,cardNumber:card.cardNumber,sheetNumber:sh.sheetNumber,customerName:sh.customerName,phone:sh.phone||'',prize:fig.prize,figureName:fig.name,figureIndex:figIdx,ballsDrawn:drawn.length,createdAt:Date.now()});

        return;

      }

    }

  }

}



async function txNext(){

  const gs=S.gs;

  const nextIdx=(gs.currentFigureIndex||0)+1;

  const draw=S.draws[gs.currentDrawId];

  if(!draw)return;

  if(nextIdx>=10||!draw.figures?.[nextIdx]){

    await txFinish(); return;

  }

  await rtUpd('gameState',{status:'announcing_figure',currentFigureIndex:nextIdx,currentBall:null,drawnBalls:[],currentWinner:null});

}



async function txFinish(){

  const gs=S.gs;

  await rtUpd('gameState',{status:'finished'});

  if(gs.currentDrawId) await rtUpd(`draws/${gs.currentDrawId}`,{status:'finished'});

}



async function txReset(){

  await rtSet('gameState',{status:'waiting',currentDrawId:null,currentFigureIndex:0,currentBall:null,drawnBalls:[],currentWinner:null});

}



/* ── AUTO MODE ── */

let _autoIntervalId=null;

function startAutoMode(){

  if(_autoIntervalId){clearInterval(_autoIntervalId);_autoIntervalId=null;}

  S.autoMode=true;

  _autoIntervalId=setInterval(async()=>{

    if(S.gs.status!=='playing'){stopAutoMode();return;}

    await txDraw();

  },S.autoSpeed*1000);

  render();

}

function stopAutoMode(){

  if(_autoIntervalId){clearInterval(_autoIntervalId);_autoIntervalId=null;}

  if(S.autoMode){S.autoMode=false;render();}

}

/* ═══════════════════════════════════════════════ CARD RENDERERS */

function renderCard(card,drawn,figCells,cardNum){

  const dSet=new Set(toArr(drawn));

  const cells=figCells?toArr(figCells):null;

  const nums=toArr(card);

  const winner=cells&&checkWin(nums,Array.from(dSet),cells);

  let h=`<div class="bc-wrap${winner?' wglow':''}">

    <div class="bc-cn">CARTÓN #${cardNum}</div>

    <div class="bc-hdrs">${COLS.map(c=>`<div class="bc-h ${c}">${c}</div>`).join('')}</div>

    <div class="bc-grid">`;

  for(let row=0;row<5;row++){

    for(let col=0;col<5;col++){

      const isCtr=col===2&&row===2;

      const val=nums[col]?.[row]??0;

      const hit=isCtr?true:dSet.has(val);

      const hi=cells?cells[row*5+col]:false;

      h+=`<div class="bc-cell ${COLS[col]}${hit?' hit':''}${isCtr?' ctr':''}${hi?' fhi':''}">

        ${isCtr?`<span class="cn">#${val}</span>`:val}

      </div>`;

    }

  }

  return h+`</div></div>`;

}



function renderFigCard(cells,label){

  const c=toArr(cells);

  let h=`<div class="bc-wrap">

    ${label?`<div class="bc-cn">${label}</div>`:''}

    <div class="bc-hdrs">${COLS.map(x=>`<div class="bc-h ${x}">${x}</div>`).join('')}</div>

    <div class="bc-grid">`;

  for(let row=0;row<5;row++){

    for(let col=0;col<5;col++){

      const isCtr=col===2&&row===2;

      const on=c[row*5+col]||isCtr;

      h+=`<div class="bc-cell ${COLS[col]}${on?' hit':''}${isCtr?' ctr':''}">

        ${isCtr?`<span class="cn">N°</span>`:''}

      </div>`;

    }

  }

  return h+`</div></div>`;

}



function renderEdGrid(cells){

  let h=`<div class="fec-grid">`;

  for(const c of COLS)h+=`<div class="fec-hdr ${c}">${c}</div>`;

  for(let row=0;row<5;row++){

    for(let col=0;col<5;col++){

      const idx=row*5+col;

      const isCtr=idx===CTR;

      const on=cells[idx];

      h+=`<div class="fec-cell${isCtr?' fec-ctr':on?' fec-on':''}"${!isCtr?` data-fcell="${idx}"`:''}>${isCtr?'N°':''}</div>`;

    }

  }

  return h+`</div>`;

}



function renderFigMini(cells){

  const c=toArr(cells);

  return`<div class="fig-mini">${Array.from({length:25},(_,i)=>`<div class="fmc${c[i]||i===CTR?' on':''}"></div>`).join('')}</div>`;

}



/* ═══════════════════════════════════════════════ TX PHASES */

function renderTx(gs,draw){

  const st=gs.status;

  if(!draw||st==='waiting')return txWaiting();

  if(st==='announcing_figure')return txAnnouncing(gs,draw);

  if(st==='playing')return txPlaying(gs,draw);

  if(st==='winner_found')return txWinner(gs,draw);

  if(st==='finished')return txFinished(draw);

  if(st==='no_winner')return txNoWinner(gs);

  return txWaiting();

}



function txWaiting(){

  const up=Object.entries(S.draws).map(([id,d])=>({id,...d})).filter(d=>d.status==='scheduled'||d.status==='live').sort((a,b)=>new Date(a.date+'T'+a.time)-new Date(b.date+'T'+b.time));

  return`<div class="tx-wait">

    <div style="font-size:3.5rem;margin-bottom:.75rem">🎱</div>

    <h2 class="gold fw8" style="font-size:1.8rem;margin-bottom:.4rem">En espera...</h2>

    <p class="gray mb2">El sorteo comenzará pronto. ¡Prepárate!</p>

    ${up.length?`<div class="card gl" style="max-width:380px;width:100%">

      <div class="xs gray fw7 mb05" style="text-transform:uppercase;letter-spacing:.08em">Próximo sorteo</div>

      <div class="fw7 white" style="font-size:1.1rem">${up[0].name}</div>

      <div class="gold sm" style="font-family:'Space Mono',monospace">${up[0].date} – ${up[0].time}</div>

      <button class="btn btn-g btn-full mt1" data-nav="comprar">🛒 Comprar Hojas</button>

    </div>`:''}

  </div>`;

}



function txAnnouncing(gs,draw){

  const fi=gs.currentFigureIndex||0;

  const fig=draw.figures?.[fi];

  const cells=fig?toArr(fig.cells):Array(25).fill(false);

  return`<div class="tx-ann">

    <div class="tx-ann-ord">Figura ${fi+1} de 10</div>

    <div class="tx-ann-name">${fig?.name||'Figura '+(fi+1)}</div>

    <div class="tx-ann-prize">${fmtCOP(fig?.prize)}</div>

    <div class="tx-ann-card">${renderFigCard(cells,'PATRÓN A COMPLETAR')}</div>

    <div class="tx-ann-sub">Espera el inicio del sorteo de balotas...</div>

  </div>`;

}



function txPlaying(gs,draw){

  const fi=gs.currentFigureIndex||0;

  const fig=draw.figures?.[fi];

            <button class="btn btn-o btn-sm" data-edit-pur="${p.id}" title="Editar / Reabrir">✏️ Editar</button>
            <button class="btn btn-r btn-sm" data-del-pur="${p.id}" title="Eliminar">🗑</button>
          </div>
        </div>
      </div>`).join('')}</div>
    </div>`:''}

    ${!allPurs.length?`<div class="empty"><div style="font-size:2.5rem">💰</div><p class="gray mt05">No hay compras aún.</p></div>`:''}
    ${allPurs.length&&!filtered.length?`<div class="empty"><p class="gray sm">Sin resultados para los filtros aplicados. <button class="btn btn-gy btn-sm" id="btn-pur-clear">✕ Limpiar filtros</button></p></div>`:''}
  </div>`;
}

/* ═══════════════════════════════════════════════ BIND */

function bind(){

  // Nav

  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.nav)));

  // Admin tabs

  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{S.adminTab=el.dataset.tab;render()}));

  // Ganadores filter

  document.getElementById('gan-draw-filter')?.addEventListener('change',e=>{S._ganFilter=e.target.value;render()});

  // Logout

  document.getElementById('btn-logout')?.addEventListener('click',()=>signOut(auth).then(()=>nav('home')));



  // QTY buttons

  document.querySelectorAll('[data-minus]').forEach(el=>el.addEventListener('click',()=>{

    const id=el.dataset.minus;S.qty[id]=Math.max(1,(S.qty[id]||1)-1);updateQty(id);

  }));

  document.querySelectorAll('[data-plus]').forEach(el=>el.addEventListener('click',()=>{

    const id=el.dataset.plus;S.qty[id]=Math.min(20,(S.qty[id]||1)+1);updateQty(id);

  }));

  function updateQty(id){

    const d=S.draws[id];if(!d)return;

    const q=S.qty[id]||1;

    const cps=Number(d.cardsPerSheet||6);

    const pps=Number(d.pricePerSheet||5000);

    const qv=document.getElementById('qv-'+id);

    const qi=document.getElementById('qi-'+id);

    if(qv)qv.textContent=q;

    if(qi)qi.innerHTML=`${cps*q} cartones · <strong class="gold" style="font-family:'Space Mono',monospace">${fmtCOP(pps*q)}</strong>`;

  }



  // Checkout

  document.querySelectorAll('[data-checkout]').forEach(el=>el.addEventListener('click',()=>{

    const id=el.dataset.checkout;

    S.checkoutDraw={id,...S.draws[id]};

    S.checkoutSheets=S.qty[id]||1;

    nav('checkout');

  }));



  // Checkout submit

  document.getElementById('btn-co-submit')?.addEventListener('click',async()=>{

    const name=document.getElementById('co-name')?.value.trim();

    const phone=document.getElementById('co-phone')?.value.trim();

    if(!name||!phone){notify('Completa todos los campos','err');return}

    if(phone.length<10){notify('Ingresa un número de teléfono válido (10 dígitos)','err');return}

    const draw=S.checkoutDraw;

    const n=S.checkoutSheets;

    const total=Number(draw.pricePerSheet||5000)*n;

    const pid=await rtPush('purchases',{drawId:draw.id,drawName:draw.name,customerName:name,phone:'+57'+phone,quantity:n,total,status:'pending',createdAt:Date.now()});

    const waNum=S.settings.whatsappNumber||'573001234567';

    const msg=encodeURIComponent(`¡Hola! Quiero comprar hojas para el sorteo "${draw.name}".\n\nNombre: ${name}\nTeléfono: +57${phone}\nHojas: ${n}\nTotal: ${fmtCOP(total)}\nID Pedido: ${pid}\n\nAdjunto el comprobante de pago.`);

    window.open(`https://wa.me/${waNum}?text=${msg}`,'_blank');

    notify('¡Pedido registrado! Continúa en WhatsApp ✓','ok');

    nav('home');

  });



  // Login

  document.getElementById('btn-login')?.addEventListener('click',async()=>{

    const email=document.getElementById('li-email')?.value;

    const pass=document.getElementById('li-pass')?.value;

    const errEl=document.getElementById('li-err');

    try{

      await signInWithEmailAndPassword(auth,email,pass);

      nav('admin');

    }catch(e){

      if(errEl){errEl.textContent='Credenciales incorrectas.';errEl.classList.remove('hidden')}

    }

  });

  document.getElementById('li-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-login')?.click()});



  // Player access code

  document.getElementById('btn-find')?.addEventListener('click',()=>{

    const code=document.getElementById('ac-code')?.value.trim().toUpperCase();

    if(!code||code.length<5){notify('Ingresa un código válido (ej: BL-A3K9PQ)','err');return}

    S.accessCode=code;render();

  });

  document.getElementById('ac-code')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-find')?.click()});

  document.getElementById('btn-chg-ph')?.addEventListener('click',()=>{S.accessCode='';render()});



  // Sala: código de acceso

  document.getElementById('btn-sala-find')?.addEventListener('click',()=>{

    const code=document.getElementById('sala-code')?.value.trim().toUpperCase();

    if(!code||code.length<5){notify('Ingresa un código válido (ej: BL-A3K9PQ)','err');return}

    S.accessCode=code;render();

  });

  document.getElementById('sala-code')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-sala-find')?.click()});

  document.getElementById('btn-sala-clear')?.addEventListener('click',()=>{S.accessCode='';render()});



  // Admin: copy code buttons

  document.getElementById('btn-copy-code')?.addEventListener('click',e=>{

    const code=e.currentTarget.dataset.code;

    navigator.clipboard?.writeText(code).then(()=>notify(`¡Código ${code} copiado!`,'ok')).catch(()=>notify(code,'inf'));

  });

  document.getElementById('btn-dismiss-code')?.addEventListener('click',()=>{S.lastConfirmedCode=null;render()});

  document.querySelectorAll('[data-copy-code]').forEach(el=>el.addEventListener('click',()=>{

    const code=el.dataset.copyCode;

    navigator.clipboard?.writeText(code).then(()=>notify(`¡Código ${code} copiado!`,'ok')).catch(()=>notify(code,'inf'));

  }));



  // Admin: enviar WA al cliente con código de acceso

  document.getElementById('btn-wa-client')?.addEventListener('click',e=>{

    const {phone,code,name,drawname,drawdate,drawtime}=e.currentTarget.dataset;

    // Fix prefijo: wa.me NO acepta '+', debe ser solo dígitos. +573001234567 → 573001234567

    const clientPhone=phone.replace(/^\+/,'').replace(/\s/g,'') || '57';

    const siteUrl=window.location.origin+window.location.pathname;

    const drawLine=drawname?`📅 *Sorteo:* ${drawname}\n🗓 *Fecha:* ${drawdate} – ${drawtime}\n\n`:'';

    const msg=encodeURIComponent(

      `¡Hola ${name}! 🎱 *Bol$illo Lleno – Bingo Online*\n\n`+

      `✅ Tu compra fue *confirmada*.\n\n`+

      `🔑 *Tu código de acceso:*\n`+

      `*${code}*\n\n`+

      `${drawLine}`+

      `📲 *¿Cómo entrar al sorteo?*\n`+

      `1️⃣ Abre: ${siteUrl}\n`+

      `2️⃣ Ve a la sección *Sala*\n`+

      `3️⃣ Ingresa tu código: *${code}*\n`+

      `4️⃣ ¡Tus cartones se marcan solos en tiempo real! 🎉\n\n`+

      `🍀 ¡Mucha suerte!`

    );

    window.open(`https://wa.me/${clientPhone}?text=${msg}`,'_blank');

  });



  // ADMIN: purchase management
  document.querySelectorAll('[data-edit-pur]').forEach(el=>el.addEventListener('click',()=>{S.editPur=el.dataset.editPur;render()}));
  document.querySelectorAll('[data-del-pur]').forEach(el=>el.addEventListener('click',()=>deletePurchaseAdmin(el.dataset.delPur)));
  document.getElementById('btn-cancel-pur-edit')?.addEventListener('click',()=>{S.editPur=null;render()});
  document.getElementById('btn-save-pur-edit')?.addEventListener('click',saveEditPurchase);
  document.getElementById('btn-del-pur-modal')?.addEventListener('click',e=>{deletePurchaseAdmin(e.currentTarget.dataset.delPur)});

  // Purchase filters
  document.getElementById('btn-pur-search')?.addEventListener('click',()=>{
    S.purFilter.q=document.getElementById('pur-q')?.value||'';render();
  });
  document.getElementById('pur-q')?.addEventListener('keydown',e=>{
    if(e.key==='Enter'){S.purFilter.q=e.target.value;render();}
  });
  document.getElementById('pur-draw-f')?.addEventListener('change',e=>{S.purFilter.draw=e.target.value;render()});
  document.getElementById('pur-status-f')?.addEventListener('change',e=>{S.purFilter.status=e.target.value;render()});
  document.getElementById('btn-pur-clear')?.addEventListener('click',()=>{S.purFilter={draw:'',status:'',q:''};render()});

  // WhatsApp for confirmed purchase row
  document.querySelectorAll('[data-wa-pur]').forEach(el=>el.addEventListener('click',()=>{
    const pid=el.dataset.waPur;
    const p=S.purchases[pid];
    if(!p)return;
    const draw=S.draws[p.drawId];
    const clientPhone=(p.phone||'').replace(/^\+/,'').replace(/\s/g,'')||'57';
    const siteUrl=window.location.origin+window.location.pathname;
    const sheetLabel=p.sheetStart!=null?(p.quantity>1?`Hojas #${p.sheetStart} al #${p.sheetStart+p.quantity-1}`:`Hoja #${p.sheetStart}`):'';
    const msg=encodeURIComponent(
      `¡Hola ${p.customerName}! 🎱 *Bol$illo Lleno – Bingo Online*\n\n`+
      `✅ Tu compra fue *confirmada*.\n\n`+
      `🔑 *Tu código de acceso:*\n`+
      `*${p.accessCode||'—'}*\n\n`+
      (draw?`📅 *Sorteo:* ${draw.name}\n🗓 *Fecha:* ${draw.date||''} – ${draw.time||''}\n\n`:'')+
      (sheetLabel?`🎴 ${sheetLabel}\n\n`:'')+
      `📲 *¿Cómo entrar al sorteo?*\n`+
      `1️⃣ Abre: ${siteUrl}\n`+
      `2️⃣ Ve a la sección *Sala*\n`+
      `3️⃣ Ingresa tu código: *${p.accessCode||'—'}*\n`+
      `4️⃣ ¡Tus cartones se marcan solos en tiempo real! 🎉\n\n`+
      `🍀 ¡Mucha suerte!`
    );
    window.open(`https://wa.me/${clientPhone}?text=${msg}`,'_blank');
  }));

  // ADMIN: new draw form

  document.getElementById('btn-new-draw')?.addEventListener('click',()=>{

    document.getElementById('new-draw-form')?.classList.toggle('hidden');

  });

  document.getElementById('btn-cancel-draw')?.addEventListener('click',()=>{

    document.getElementById('new-draw-form')?.classList.add('hidden');

  });

  document.getElementById('btn-save-draw')?.addEventListener('click',async()=>{

    const name=document.getElementById('nd-name')?.value.trim();

    const date=document.getElementById('nd-date')?.value;

    const time=document.getElementById('nd-time')?.value;

    const desc=document.getElementById('nd-desc')?.value.trim();

    const price=Number(document.getElementById('nd-price')?.value)||5000;

    const cps=Number(document.getElementById('nd-cps')?.value)||6;

    if(!name||!date||!time){notify('Completa nombre, fecha y hora','err');return}

    await createDraw({name,date,time,description:desc,pricePerSheet:price,cardsPerSheet:cps});

    document.getElementById('new-draw-form')?.classList.add('hidden');

  // ADMIN: delete draw

  document.querySelectorAll('[data-del-draw]').forEach(el=>el.addEventListener('click',()=>deleteDraw(el.dataset.delDraw)));



  // ADMIN: go to figures

  document.querySelectorAll('[data-set-fig]').forEach(el=>el.addEventListener('click',()=>{

    S.adminSelDraw=el.dataset.setFig;S.adminTab='figuras';S.figEd={idx:null,cells:Array(25).fill(false),name:'',prize:''};render();

  }));



  // ADMIN: figures draw selector

  document.getElementById('fig-draw-sel')?.addEventListener('change',e=>{

    S.adminSelDraw=e.target.value||null;

    S.figEd={idx:null,cells:Array(25).fill(false),name:'',prize:''};

    render();

  });



  // ADMIN: edit figure slot

  document.querySelectorAll('[data-edit-fig]').forEach(el=>el.addEventListener('click',()=>{

    const idx=parseInt(el.dataset.editFig);

    const fig=S.draws[S.adminSelDraw]?.figures?.[idx];

    S.figEd={idx,cells:fig?[...toArr(fig.cells)]:Array(25).fill(false),name:fig?.name||'',prize:fig?.prize||''};

    render();

  }));



  // ADMIN: figure cell toggle

  document.querySelectorAll('[data-fcell]').forEach(el=>el.addEventListener('click',()=>{

    const idx=parseInt(el.dataset.fcell);

    if(idx===CTR)return;

    S.figEd.cells[idx]=!S.figEd.cells[idx];

    // Re-render only the grid

    const grid=el.closest('.fec-grid');

    if(grid){grid.outerHTML=renderEdGrid(S.figEd.cells);bind()}else render();

  }));



  // ADMIN: save figure

  document.getElementById('btn-save-fig')?.addEventListener('click',async()=>{

    const fe=S.figEd;

    const name=document.getElementById('fig-name')?.value.trim();

    const prize=document.getElementById('fig-prize')?.value;

    if(!name){notify('Ingresa el nombre de la figura','err');return}

    if(!prize||Number(prize)<=0){notify('Ingresa el valor del premio','err');return}

    if(!fe.cells.some((c,i)=>c&&i!==CTR)){notify('Marca al menos una casilla en la figura','err');return}

    await saveFigure(S.adminSelDraw,fe.idx,name,prize,fe.cells);

    render();

  });

  // ADMIN: clear figure cells

  document.getElementById('btn-clear-fig')?.addEventListener('click',()=>{

    S.figEd.cells=Array(25).fill(false);render();

  });

  // ADMIN: cancel figure edit

  document.getElementById('btn-cancel-fig')?.addEventListener('click',()=>{

    S.figEd={idx:null,cells:Array(25).fill(false),name:'',prize:''};render();

  });

  // ADMIN: delete figure

  document.getElementById('btn-del-fig')?.addEventListener('click',async()=>{

    if(!confirm('¿Eliminar esta figura?'))return;

    await rtDel(`draws/${S.adminSelDraw}/figures/${S.figEd.idx}`);

    S.figEd={idx:null,cells:Array(25).fill(false),name:'',prize:''};

    notify('Figura eliminada','inf');

    render();

  });


  // ADMIN: confirm/reject purchases

  document.querySelectorAll('[data-confirm]').forEach(el=>el.addEventListener('click',()=>confirmPurchase(el.dataset.confirm)));

  document.querySelectorAll('[data-reject]').forEach(el=>el.addEventListener('click',()=>rejectPurchase(el.dataset.reject)));



  // ADMIN: transmission controls

  document.getElementById('btn-tx-init')?.addEventListener('click',async()=>{

    const id=document.getElementById('tx-draw-sel')?.value;

    if(!id){notify('Selecciona un sorteo','err');return}

    await txInit(id);

    await txAnnounce();

  });

  document.getElementById('btn-tx-play')?.addEventListener('click',()=>txStartPlay());

  document.getElementById('btn-draw-ball')?.addEventListener('click',()=>txDraw());

  document.getElementById('btn-next-fig')?.addEventListener('click',()=>txNext());

  document.getElementById('btn-finish-draw')?.addEventListener('click',()=>txFinish());

  document.getElementById('btn-tx-stop')?.addEventListener('click',async()=>{

    if(!confirm('¿Detener la transmisión actual?'))return;

    await rtUpd('gameState',{status:'waiting'});

  });

  document.getElementById('btn-tx-reset')?.addEventListener('click',()=>txReset());

  // AUTO MODE
  document.getElementById('btn-auto-start')?.addEventListener('click',()=>{
    const spd=parseInt(document.getElementById('auto-speed-inp')?.value)||5;
    S.autoSpeed=Math.max(1,Math.min(60,spd));
    startAutoMode();
  });

  document.getElementById('btn-auto-stop')?.addEventListener('click',()=>{
    stopAutoMode();
  });



  // ADMIN: settings save

  document.getElementById('btn-save-settings')?.addEventListener('click',async()=>{

    await rtUpd('settings',{

      whatsappNumber:document.getElementById('set-wa')?.value.trim()||'',

      bankName:document.getElementById('set-bank')?.value.trim()||'',

      bankAccount:document.getElementById('set-acc')?.value.trim()||'',

      accountHolder:document.getElementById('set-holder')?.value.trim()||'',

      pricePerSheet:Number(document.getElementById('set-price')?.value)||5000,

      cardsPerSheet:Number(document.getElementById('set-cps')?.value)||6,

    });

    notify('Ajustes guardados ✓','ok');

  });



  // Dashboard tab shortcut

  document.querySelectorAll('[data-tab="compras"]').forEach(el=>el.addEventListener('click',()=>{S.adminTab='compras';render()}));

}



/* ═══════════════════════════════════════════════ INIT */

// Leer código desde URL: ?code=BL-XXXXXX

(()=>{

  const urlCode=new URLSearchParams(window.location.search).get('code');

  if(urlCode){S.accessCode=urlCode.toUpperCase().trim();S.page='play';}

})();

onAuthStateChanged(auth,u=>{S.user=u;S.isAdmin=!!(u&&u.uid===ADMIN_UID);render()});

initListeners();

render();

</script>
